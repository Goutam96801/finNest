name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: 'eas.json build profile'
        options:
          - preview
          - production
        default: preview
        required: true

defaults:
  tools:
    node: 22.19.4

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: ${{ inputs.profile }}
